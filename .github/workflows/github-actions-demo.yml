name: Github Actions Demo
run-name: Demo

permissions:
  contents: read

cache-mode: none

on:
  push:
    branches: [main]
    paths-ignore: [/.github/**]
  pull_request:
    branches: [main]
  schedule:
    - cron: "15 6 * * 0"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        type: environment
        required: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          echo "triggered by"
          echo ${{github.event_name}}
      - run: |
          echo "Based on the branch:"
          echo ${{github.ref_name}}
      - run: |
          echo "The repository $REPOSITORY contains the following files:"
          tree
        env:
          REPOSITORY: ${{ github.repository }}
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: Test
    steps:
      - run: |
          echo "Testing..."
  load-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: Load-Test
    steps:
      - run: |
          echo "Testing..."
          sleep 15
  production:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'Production'
    needs: [test, load-test]
    environment:
      name: Production
      url: https://writeabout.net
    steps:
      - run: |
          echo "Step 1 deploying to production..."
          sleep 10
          echo "Step 2 deploying to production..."
          sleep 10
          echo "Step 3 deploying to production..."
          sleep 10
          echo "Step 4 deploying to production..."
          sleep 10
          echo "Step 5 deploying to production..."
          sleep 10
