name: container demo
run-name: container demo
permissions:
    contents: read

on:
    workflow_dispatch:

jobs:
    step-container:
        runs-on: ubuntu-latest
        steps:
            - name: On the runner
              run: cat /etc/os-release

            - name: In alpine
              uses: docker://alpine:3.22
              with:
                  entrypoint: /bin/sh
                  args: -c "cat /etc/os-release"
    job-container:
        runs-on: ubuntu-latest
        container:
            image: node:22-bookworm-slim

        steps:
            - name: Print version
              run: |
                  npm --version && node --version
                  cat /etc/os-release
