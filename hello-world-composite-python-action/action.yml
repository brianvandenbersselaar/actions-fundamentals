name: hello-world
description: A hello world composite action written in Python
inputs:
  who-to-greet:
    description: Who to greet
    required: true
    default: World
outputs:
  time:
    description: The time we greeted you
    value: ${{ steps.greet.outputs.time }}
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7.1.0
      with:
        python-version: "3.x"
    - name: Greet
      id: greet
      shell: bash
      run: python "$GITHUB_ACTION_PATH/greet.py"
      env:
        INPUT_WHO_TO_GREET: ${{ inputs.who-to-greet }}
